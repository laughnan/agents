# Tools this setup and its skills need. `make deps` installs them.
#   jq    scripts/install
#   node  statechart's launcher (22.18+ or 23.6+)
#   java, tla2tools  statechart's model checker; keep both in step with
#         TLC_TOOL and JAVA_TOOL in skills/statechart/tool/run.ts
[tools]
jq = "1"
node = "22"
java = "temurin-25"
"http:tla2tools" = { version = "1.7.4", url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar", checksum = "sha256:936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" }
