# Optional tools for the statechart skill. `make deps` installs them.
# Keep java and tla2tools in step with JAVA_TOOL and TLC_TOOL in
# skills/statechart/tool/run.ts, and node with skills/statechart/scripts/statechart.
# (jq, which scripts/install and the hooks need on every PATH, comes from
# Homebrew via `make`.)
[tools]
node = "22"
java = "temurin-25"
"http:tla2tools" = { version = "1.7.4", url = "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar", checksum = "sha256:936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" }
